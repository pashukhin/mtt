description: |-
    Bring bet #2 (external tracker as store-of-record) forward: the public release (t60) should let adopters put mtt's executable gates on a free, popular tracker they already use — GitHub Issues first — VALIDATED BY DOGFOODING it on this repo before release ("an mtt that doesn't dogfood itself is a poor one"). Concrete first slice of the t9 umbrella (t9 stays for Jira/Confluence + the indexer hook).

    CRUX to resolve in the spec (brainstorm first): WHERE mtt's executable gates live when the task store is an external tracker whose transitions are its own. Two models — (a) mtt is the gating LAYER that OWNS the flow+gates, the external tracker is task data-of-record; (b) map mtt's flow onto the tracker's native workflow (GitHub Issues has ~none — a label/Projects convention?). This is the DESIGN open question ("which flow is authoritative") and it decides whether an external adapter preserves the wedge at all.

    Scope (the spec will decompose, possibly into follow-ups): (1) flow-authority decision-record; (2) composition-root adapter-SELECTION seam — today every CLI site hardwires yaml.NewTaskStore/NewKnowledgeStore inline (~20 sites; no factory, no backend config, no `mtt connect`); a per-port selection seam is the prerequisite (overlaps t61); (3) a GitHub Issues TaskStore adapter (auth; id mapping #N <-> TaskID; status <-> flow per the chosen model; dep/parent mapping; Capabilities()/ErrUnsupported for what Issues cannot do); (4) backend-selection config (credentials in config.local, never committed); (5) DOGFOOD on this repo before t60. KB stays YAML — GitHub Issues has no knowledge base, so the pairing is tasks-from-GitHub + KB-YAML (the independent-ports design already anticipates this mixed pairing). Positioning guardrail (KB positioning-vs-beads): frame as "executable gates on your existing GitHub board" — the adapter as the wedge's adoption vehicle, NOT "another GitHub sync tool" (a crowded slot).
