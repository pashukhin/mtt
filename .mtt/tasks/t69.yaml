description: 'Pre-1.0 polish (Variant A, 2026-07-27). Turn hashtag-to-tag extraction from task text into a setting in the COMMITTED project config, default OFF, governing extraction from BOTH title and description; with it off, explicit --tag / tag add is the only tag source. Rationale: importing real prose mints spurious tags that tag rm cannot remove (it re-derives from the text) — the pilot hit this, and it blocks a clean import. Explicit over implicit. Wiring reaches core (Adder/Editor) where the text is parsed. Relates to t49 (note-side extraction, still explicit-only for the markdown-heading-collision reason) and t67 (import). Supersedes the earlier opt-in / title-only framing.'
