description: 'Greenfield pilot (tessera, Python) evidence: (1) the very FIRST real task was no-code design — coding.yaml has only feature/bugfix/refactor (all code-gated), so a ''design'' type had to be authored by hand. (2) Every gate is Makefile-shaped (''make lint''/''make test'') — a Python/JS adopter rewrites all of them. Options: ship a combined ''project'' template (code types + a no-code design type with a doc-exists gate) and/or make coding''s gates toolchain-neutral or per-language variants. This is the evidence base for the ''near-industrial sample'' idea; let the pilot''s matured config seed it. Relates t78 (gallery), t62 (templates).'
