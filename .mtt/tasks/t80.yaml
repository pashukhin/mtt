description: 'Pilot friction: Python gates ''pytest''/''ruff'' were not found — gates run via sh -c without the project venv activated, so tools on the venv PATH are invisible. Had to use ''.venv/bin/pytest''/''.venv/bin/ruff''. Add a FLOW_GUIDE note: gate/post run in a bare shell; use absolute tool paths or activate your env inside the command. A common first-hour gotcha for venv/nvm/rbenv adopters.'
