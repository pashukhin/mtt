description: |-
    Surfaced by the v0.11.0 pilot on the shipped git-flow flagship template (people copy it, so its sharp edges ship to everyone). Two footguns: (1) `deliver` greps main for the squash commit; if the integration/base branch has UNPUSHED local commits when a task branches, the PR squash folds them in and local main diverges from origin after merge -> `deliver` can't find the commit (recovered via `git reset --hard origin/main`). Make `deliver` divergence-aware (pull-with-strategy, or detect+explain) or make the sample caveat loud ("push the base branch before starting a task"). (2) mtt's per-move bookkeeping `git commit` fires FOREIGN git hooks (another tool's `core.hooksPath`) — latency + message noise; the pilot isolated it with `git -c core.hooksPath=/dev/null commit ...` in every config command. The shipped templates should run their own bookkeeping commits hook-free by default (or ship a documented switch). Same family: the `--no-run`-skips-every-command trap on state-moving edges (consider a runtime warning). See KB note flow-v2-deliver-reconcile-midflight-backlog.


    --- Pilot Q2 answer (generalized precise trigger + fix). Divergence trigger = (unpushed commits on the integration/base branch at branch time) x (PR base = origin/base) x (squash-merge). Sequence: the local base tip has commits C1,C2 not on origin; `start` branches task/<id> from the local tip so C1,C2 ride onto the pushed task branch; the PR base is origin/base (stale, lacks C1,C2); squash-merge collapses the PR diff into ONE new commit S on origin/base; local base still has C1,C2 as separate commits while origin has S (same content, different commits) -> diverged, and deliver's squash-grep cannot find S locally. mtt AMPLIFIES the setup: a no-branch entity (a task/story worked directly on the base branch) auto-commits `.mtt` onto the base per move, so unpushed base commits accumulate fast. Fix (general): `start` pulls+pushes the base branch BEFORE branching (origin==local => the PR base contains everything); deliver/cancel push the base after landing; deliver guards with `git pull --ff-only`. Confirms KB note flow-v2-deliver-reconcile-midflight-backlog.
