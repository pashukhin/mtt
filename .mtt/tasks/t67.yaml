description: |-
    Surfaced by the v0.11.0 pilot (full tracker migration). Replacing an incumbent tracker is a core adoption moment, but today it is DIY — a bash loop over the old tool's JSON piped into `mtt add`. Ship a first-class `mtt import` (JSONL/CSV -> tasks) with a field map (title/description/type/priority/parent/tags) and id-preservation. Highest-leverage adoption feature per the pilot; pairs with `mtt export`. Design-open: input format(s), field-map syntax, id-preservation vs mint, status/flow mapping (or fields-only), dedup/idempotency on re-run, how `parent` resolves when ids are preserved. Mind the auto-hashtag footgun (importing prose mints spurious tags — see the task-hashtag-policy task).


    --- Pilot Q1 answers (generalized, not source-specific). (1) Prefer the source tool's LIVE rich JSON (e.g. its `list --json`) over a committed file export — the live query exposes parent/epic linkage and fields the flat export omits. (2) Field-map has three tiers: plain fields 1:1; TYPE via a configurable source->target table (source trackers usually have more types than a given mtt config); PRIORITY via a configurable N-level->3 table. Neither type nor priority is 1:1 — both need a declared map, never hardcoding. (3) STATUS is the design crux: an mtt status carries FLOW SEMANTICS (you ARRIVE at it by passing its gates), whereas a flat tracker's status is a bare label — so faithfully setting status on import would BYPASS the very gates that are mtt's point. Default the importer to "open items -> initial status" (backlog seeding) and do NOT reconstruct in-flight/closed flow positions; offer reconstruction only behind an explicit, warned `--no-gate` mode. Mental model: import = backlog seeding; archive the source tool's closed history rather than importing it. (4) Map source depends_on -> `mtt dep`, source parent/epic -> mtt parent (subject to the type-hierarchy rule).
