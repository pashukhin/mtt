    v0.11.0 pilot addition: file-per-task + a git commit per mutation is elegant at ~55 tasks but untested at 1k-10k (behavior, latency, and commit volume). Add a scale benchmark and a documented ceiling. Relates to the bookkeeping-commit-noise finding (a coalesce/quiet mode for long-lived branches) and to the observed push-per-mutation fragility under rapid bulk mutation (see t72).
