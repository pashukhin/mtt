created: "2026-07-29T05:19:52Z"
updated: "2026-07-29T16:03:38Z"
description: |-
    Sharp pilot finding: an agent that forgets --who is silently recorded as the HUMAN, because attribution resolves --who > MTT_BY > config.local author, and a shared checkout config.local carries the human author. require {who true} does NOT fix this (it is satisfied by the config.local author). Real fix: mtt agent hooks / mtt init should scaffold env {MTT_BY: agent, MTT_ROLE: agent} into .claude/settings.json so agent invocations attribute correctly out of the box, while a human in the same checkout stays themselves via author. Verified the write mechanics work (mtt show showed by claude, role agent). Relates t52 (hooks scaffold), t73/t82 (author/config surface). Keep the canonical-author rule: config.local author is the human source of truth; agents via MTT_BY env, not by hand-overriding config.local.

    Pilot-2 (contact_energy, a 4-role multi-session build, 2026-07-29) sharpens this: by DEFAULT attribution is AUTHORLESS on both paths, which is worse than "mis-attributed as human". (a) create-path — `mtt add` / `mtt note add` write NO `by` and NO history entry at all, so a seed-only role (bootstrap, planner) leaves an entirely authorless backlog even when it exports MTT_BY. Consider recording `by` on create. (b) transition-path — `by` appears only when the agent volunteers --who; across the pilot the designer and planner did (with UNSTANDARDIZED handles: "domain-designer" vs "planner (d2)"), but the IMPLEMENTER — the busiest role, ~34 transitions over 12 features + chores — passed --who ZERO times, so every build transition is authorless. The implementer retro confirms the actor never even considers attribution, so the fix must be a default/enforcement (MTT_BY/MTT_ROLE scaffold), never a "remember --who" reminder. Also worth: a standard role-handle so cross-session provenance is comparable.
