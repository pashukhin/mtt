description: 'Sharp pilot finding: an agent that forgets --who is silently recorded as the HUMAN, because attribution resolves --who > MTT_BY > config.local author, and a shared checkout config.local carries the human author. require {who true} does NOT fix this (it is satisfied by the config.local author). Real fix: mtt agent hooks / mtt init should scaffold env {MTT_BY: agent, MTT_ROLE: agent} into .claude/settings.json so agent invocations attribute correctly out of the box, while a human in the same checkout stays themselves via author. Verified the write mechanics work (mtt show showed by claude, role agent). Relates t52 (hooks scaffold), t73/t82 (author/config surface). Keep the canonical-author rule: config.local author is the human source of truth; agents via MTT_BY env, not by hand-overriding config.local.'
