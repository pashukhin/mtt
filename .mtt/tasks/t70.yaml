description: 'Surfaced by the v0.11.0 pilot. `mtt edit` takes only `--description <string>` while `mtt add` has `--file -` — so migrating rich multi-line descriptions via `edit` means awkward shell-quoting. Add parity: `mtt edit --file -` (and `--file <path>`), reusing add''s body-input path. Small, high-value for scripted/bulk work.'
